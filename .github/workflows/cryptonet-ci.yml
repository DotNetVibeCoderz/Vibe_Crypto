# Builds the Rust core for every supported runtime (including Alpine/musl), tests Crypto.Net on Windows, Linux,
# macOS and Alpine, fuzzes the decoders, audits dependencies, produces an SBOM and packs the NuGet packages.
name: CryptoNet CI

on:
  push:
    branches: [main]
    paths: ["CryptoNet/**", ".github/workflows/cryptonet-*.yml"]
  pull_request:
    paths: ["CryptoNet/**", ".github/workflows/cryptonet-*.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Package version (empty = Directory.Build.props)
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: CryptoNet

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Rust ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,   target: x86_64-pc-windows-msvc,    file: cryptonet.dll,      test: true }
          - { rid: win-arm64,   os: windows-latest,   target: aarch64-pc-windows-msvc,   file: cryptonet.dll,      test: false }
          - { rid: linux-x64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  file: libcryptonet.so,    test: true }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libcryptonet.so,    test: true }
          - { rid: osx-x64,     os: macos-latest,     target: x86_64-apple-darwin,       file: libcryptonet.dylib, test: false }
          - { rid: osx-arm64,   os: macos-latest,     target: aarch64-apple-darwin,      file: libcryptonet.dylib, test: true }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CryptoNet/rust
          key: ${{ matrix.target }}

      - name: cargo test
        if: matrix.test
        working-directory: CryptoNet/rust
        run: cargo test --release

      - name: cargo build
        working-directory: CryptoNet/rust
        run: cargo build --release -p cryptonet-ffi --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: CryptoNet/rust/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  native-musl:
    name: Rust linux-musl-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # JavaScript actions do not run inside Alpine containers, so build with docker run instead.
      - name: cargo test + build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src/rust rust:1-alpine sh -euc '
            apk add --no-cache musl-dev
            cargo test --release
            RUSTFLAGS="-C target-feature=-crt-static" cargo build --release -p cryptonet-ffi
          '
          mkdir -p out
          sudo cp rust/target/release/libcryptonet.so out/

      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-musl-x64
          path: CryptoNet/out/libcryptonet.so
          if-no-files-found: error

  test-musl:
    name: .NET tests linux-musl-x64 (Alpine)
    needs: native-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-musl-x64
          path: CryptoNet/runtimes/linux-musl-x64/native

      - name: dotnet test in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DOTNET_NOLOGO=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1             mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -euc '
              dotnet test tests/Crypto.Net.Tests -c Release
              dotnet run --project tools/Crypto.Net.Cli -c Release -- doctor --json | tee doctor.json
              grep -q "\"nativeLoaded\": true" doctor.json
            '

  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CryptoNet/rust
      - working-directory: CryptoNet/rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings

  security:
    name: Supply chain (audit, deny, vulnerable packages, SBOM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit + cargo deny
        working-directory: CryptoNet/rust
        run: |
          cargo audit --deny warnings
          cargo deny check

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet vulnerability scan
        shell: bash
        run: |
          dotnet restore Crypto.Net.slnx
          dotnet list Crypto.Net.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: CryptoNet
          format: cyclonedx-json
          output-file: cryptonet-sbom.cdx.json
          artifact-name: cryptonet-sbom.cdx.json

  fuzz:
    name: Fuzz (cargo-fuzz + .NET decoders)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CryptoNet/rust/fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: cargo fuzz (60 s per target)
        working-directory: CryptoNet/rust
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: .NET decoder fuzzing (50k mutants per decoder, fresh seed per run)
        env:
          CRYPTONET_FUZZ_ITERATIONS: "50000"
          CRYPTONET_FUZZ_SEED: ${{ github.run_id }}
        run: dotnet test tests/Crypto.Net.Tests -c Release --filter "FullyQualifiedName~DecoderFuzz"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: CryptoNet/rust/fuzz/artifacts

  test:
    name: .NET tests ${{ matrix.rid }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: CryptoNet/runtimes/${{ matrix.rid }}/native

      - name: dotnet test
        run: dotnet test tests/Crypto.Net.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Native backend was used
        shell: bash
        run: |
          dotnet run --project tools/Crypto.Net.Cli -c Release -- doctor --json | tee doctor.json
          grep -q '"nativeLoaded": true' doctor.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: CryptoNet/tests/Crypto.Net.Tests/TestResults/*.trx

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: CryptoNet/tools/vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, typecheck, unit tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Integration test in a real VS Code
        run: xvfb-run -a npm run test:integration

      - name: Package .vsix
        shell: bash
        run: |
          # Marketplace versions must be plain x.y.z, so a prerelease suffix is dropped for the extension.
          v="${{ inputs.version }}"; if [ -n "$v" ]; then npm version "${v%%-*}" --no-git-tag-version --allow-same-version; fi
          npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: crypto-net-tools-vsix
          path: CryptoNet/tools/vscode-extension/crypto-net-tools.vsix
          if-no-files-found: error

  ledger:
    name: Ledger (Speculos + Ethereum app)
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: CryptoNet/runtimes/linux-x64/native

      - name: Start Speculos with Ledger's Ethereum app (public test seed)
        run: |
          mkdir -p speculos-apps
          curl -sSfL -o speculos-apps/eth.elf https://github.com/LedgerHQ/app-ethereum/releases/download/1.22.3/app-1.22.3-nanox.elf
          docker run -d --name speculos -p 9999:9999 -p 5000:5000 -v "$PWD/speculos-apps:/apps" ghcr.io/ledgerhq/speculos:latest             --model nanox /apps/eth.elf --display headless --apdu-port 9999 --api-port 5000             --seed "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5000/events > /dev/null && break; sleep 2; done
          curl -s http://127.0.0.1:5000/events | head -c 400

      - name: Ledger end-to-end tests
        env:
          CRYPTONET_SPECULOS: "1"
        run: dotnet test tests/Crypto.Net.Tests -c Release --filter "FullyQualifiedName~LedgerSpeculosTests" --logger "console;verbosity=normal"

      - name: Speculos log
        if: failure()
        run: docker logs speculos | tail -100

  ledger-solana:
    name: Ledger (Speculos + Solana app)
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: CryptoNet/runtimes/linux-x64/native

      - name: Build Ledger's Solana app (pinned commit) with Ledger's app builder
        run: |
          git clone --quiet https://github.com/LedgerHQ/app-solana.git app-solana
          git -C app-solana checkout --quiet 22d6c9b78d6721acdc6d0ce49788a2fd9ea409a0
          git -C app-solana submodule update --init --recursive --quiet
          docker run --rm -v "$PWD/app-solana:/app" -w /app ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite:latest             bash -c 'make BOLOS_SDK=$NANOX_SDK -j4'
          ls -l app-solana/build/nanox/bin/app.elf

      - name: Start Speculos with the Solana app (public test seed)
        run: |
          docker run -d --name speculos -p 9999:9999 -p 5000:5000 -v "$PWD/app-solana/build/nanox/bin:/apps" ghcr.io/ledgerhq/speculos:latest             --model nanox /apps/app.elf --display headless --apdu-port 9999 --api-port 5000             --seed "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5000/events > /dev/null && break; sleep 2; done
          curl -s http://127.0.0.1:5000/events | head -c 400

      - name: Ledger Solana end-to-end tests
        env:
          CRYPTONET_SPECULOS: "1"
        run: dotnet test tests/Crypto.Net.Tests -c Release --filter "FullyQualifiedName~LedgerSolanaSpeculosTests" --logger "console;verbosity=normal"

      - name: Speculos log
        if: failure()
        run: docker logs speculos | tail -100

  gallery:
    name: Gallery (desktop build + WebAssembly in Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the desktop Gallery
        run: dotnet build samples/Crypto.Net.Gallery.Desktop -c Release

      - name: Publish the WebAssembly Gallery
        run: dotnet publish samples/Crypto.Net.Gallery.Wasm -c Release -o gallery-wasm

      - name: Boot it in headless Chrome and derive a wallet in the page
        shell: bash
        run: |
          cd gallery-wasm/wwwroot
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=90000             --dump-dom "http://127.0.0.1:8765/?still=1&autorun=1" > ../dom.html
          grep -q "WebAssembly" ../dom.html
          grep -Eq "0x[0-9a-fA-F]{40}" ../dom.html

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-wasm
          path: CryptoNet/gallery-wasm/wwwroot
          if-no-files-found: error

  templates:
    name: dotnet new templates
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: CryptoNet/runtimes/linux-x64/native

      - name: Instantiate, build and test every template against freshly packed packages
        run: bash scripts/test-templates.sh "$RUNNER_TEMP/templates"

  pack:
    name: Pack NuGet packages
    needs: [native, native-musl, test, test-musl, lint, security, templates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: CryptoNet/native

      - name: Lay out runtimes/<rid>/native
        shell: bash
        run: |
          for dir in native/native-*; do
            rid="${dir#native/native-}"
            mkdir -p "runtimes/$rid/native"
            cp "$dir"/* "runtimes/$rid/native/"
          done
          find runtimes -type f | sort

      - name: dotnet pack
        shell: bash
        run: |
          args=(-c Release -o artifacts)
          if [ -n "${{ inputs.version }}" ]; then args+=("-p:Version=${{ inputs.version }}"); fi
          dotnet pack Crypto.Net.slnx "${args[@]}"

      - name: Verify native binaries are inside Crypto.Net.Native
        shell: bash
        run: |
          pkg=$(ls artifacts/Crypto.Net.Native.*.nupkg | grep -v snupkg)
          unzip -l "$pkg" | grep runtimes/
          test "$(unzip -l "$pkg" | grep -c 'runtimes/.*/native/')" -eq 7

      - uses: actions/upload-artifact@v7
        with:
          name: cryptonet-packages
          path: CryptoNet/artifacts/*
          if-no-files-found: error
