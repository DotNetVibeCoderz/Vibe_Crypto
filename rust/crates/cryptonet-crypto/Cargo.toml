[package]
name = "cryptonet-crypto"
description = "Core cryptographic primitives for Crypto.Net (hashing, secp256k1/ECDSA/Schnorr, ed25519, sr25519, BIP32, KDFs)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
scrypt = { version = "0.11", default-features = false }
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic", "sha256", "digest"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "zeroize"] }
schnorrkel = { version = "0.11", default-features = false, features = ["std", "getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
